baseURL = 'https://npujol.github.io/'
title = 'NaiNai'
theme = 'hugo-brewm'
enableGitInfo = true
canonifyURLs = true
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = true
enableMissingTranslationPlaceholders = true
ignoreFiles = ['\.redacted', '\.old', '\.bak', '\.tmp', '\.swp', '\.DS_Store']
enableRobotsTXT = true

[frontmatter]
date = [':default']
expiryDate = ['expiryDate', 'unpublishdate', ':default']
lastmod = ['lastmod', ':default']

[markup]

[markup.tableOfContents]
startLevel = 2
endLevel = 3
ordered = false

[markup.highlight]
codeFences = true
lineNoStart = 1
lineNos = false
lineNumbersInTable = true
noClasses = false
tabWidth = 4

[markup.goldmark]
[markup.goldmark.renderer]

unsafe = true
[markup.goldmark.extensions]
[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [
    [
        '\[',
        '\]',
    ],
    [
        '$$',
        '$$',
    ],
    [
        '\begin{equation}',
        '\end{equation}',
    ],
    [
        '\begin{align}',
        '\end{align}',
    ],
]
inline = [['\(', '\)'], ['$', '$']]

[outputs]
home = ['html', 'rss', 'json']

[sitemap]
changeFreq = 'monthly'

[services.rss]
limit = -1

[taxonomies]
category = "categories"

tag = "tags"
series = "series"
stage = "stage"
author = "author"

[params]
title = "NaiNai"
description = "Personal website of Nainai"
copyright = "Copyright 2026 © Nainai"
HideHugoCredit = true
extMeta = true
images = "/medias/red-green.jpg"

AllowAIRobots = false
ZenMode = false
DisableFootBar = false

[params.author]
name = 'Nainai'
email = 'naivy.luna@gmail.com'

[params.comments]
disabled = false

[params.fediverse]


[params.logo]
logoType = true

[params.feed]
flowlines = true
flowlinesLimit = 21

[params.home]
disableSlide = false
disableListing = false
featuredListing = ['categories', 'series']

[params.posts]
justifying = false
noIndent = false
sfdefault = false
colophon = true
disableHistory = false
related = true
share = true

[params.search]
enable = false
pagefind = false

[params.typeface]
webSafe = false
roman = 'crimson'
sans = 'inter'
localHost = true

[params.socialCard]
enable = true

[params.style.light]
ac = '#800'
bg = '#eee'
fg = '#111'
mid = 'gray'
[params.style.dark]
ac = '#f80'
bg = '#000'
fg = '#fff'
mid = 'gray'

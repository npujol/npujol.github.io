<canvas id="blood-cursor" aria-hidden="true"
  style="position:fixed;inset:0;z-index:9999;pointer-events:none;display:none;"></canvas>

<script>
(function() {
  const canvas = document.getElementById('blood-cursor');
  if (!canvas) return;

  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W, H, mx = -9999, my = -9999, dx = -9999, dy = -9999;
  let trail = [], active = false, clicked = 0, overLink = false;
  let lastScroll = performance.now();

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize, { passive: true });

  document.addEventListener('pointermove', e => {
    mx = e.clientX; my = e.clientY;
    if (!active) { dx = mx; dy = my; active = true; }
    overLink = e.target.closest('a, button, [role="button"]');
  }, { passive: true });

  document.addEventListener('pointerdown', () => clicked = 1);
  window.addEventListener('scroll', () => {
    trail.length = 0;
    lastScroll = performance.now() + 140;
  }, { passive: true });

  if (matchMedia('(prefers-reduced-motion: reduce)').matches ||
      matchMedia('(pointer: coarse)').matches) return;

  canvas.style.display = 'block';

  function loop(now) {
    ctx.clearRect(0, 0, W, H);

    if (!active) { requestAnimationFrame(loop); return; }

    dx += (mx - dx) * 0.35;
    dy += (my - dy) * 0.35;
    clicked *= 0.88;

    if (now > lastScroll) {
      trail.push({ x: dx, y: dy, t: now });
      if (trail.length > 40) trail.shift();
    }

    // Draw blood trail with blur (no opaque background)
    ctx.filter = 'blur(6px)';
    for (let i = 0; i < trail.length; i++) {
      const p = trail[i];
      const alpha = i / trail.length;
      const age = (now - p.t) / 1000;
      const size = (1 - Math.abs(alpha - 0.4) * 1.5) * 12;
      const r = Math.max(3, size * (1 + clicked * 0.6));
      const brightness = 0.4 + alpha * 0.6;
      
      ctx.fillStyle = `rgba(${Math.round(160 * brightness)},${Math.round(10 * brightness)},${Math.round(5 * brightness)},${0.3 + alpha * 0.4})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.filter = 'none';

    // Cursor blob — no blur, sharper
    const t = now % 1200 / 1200;
    const pulse = Math.exp(-(t ** 2) / 0.004) + 0.5 * Math.exp(-((t - 0.17) ** 2) / 0.006);
    const scale = 1 + pulse * 0.3 + clicked * 0.7 + (overLink ? 0.35 : 0);

    // Outer glow
    ctx.fillStyle = 'rgba(140,10,5,0.5)';
    ctx.beginPath();
    ctx.arc(mx, my, 10 * scale, 0, Math.PI * 2);
    ctx.fill();

    // Core
    ctx.fillStyle = 'rgba(200,20,10,0.85)';
    ctx.beginPath();
    ctx.arc(mx, my, 5 * scale, 0, Math.PI * 2);
    ctx.fill();

    // Tiny bright center
    ctx.fillStyle = 'rgba(255,80,40,0.9)';
    ctx.beginPath();
    ctx.arc(mx, my, 2 * scale, 0, Math.PI * 2);
    ctx.fill();

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
